<div id="rwaSpotifyMini">
  <div class="rwa-sp-head">
     <span>Spotify · double-click bar to pin</span>
    <button class="rwa-sp-close" type="button" aria-label="Close">×</button>
  </div>
  <iframe allow="encrypted-media" loading="lazy"></iframe>
</div>


<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ---------- WINDOW Z-INDEX ---------- */
  let topZ = 1000000;
  function bringPopupToFront(popup){ topZ += 1; popup.style.zIndex = topZ; }

  /* ---------- SOUND ---------- */
  const clickSound  = document.getElementById("clickSound");
  const closeSound  = document.getElementById("closeSound");
  const music       = document.getElementById("bg-music");
  const soundToggle = document.getElementById("soundToggle");
  const musicStars  = document.getElementById("music-stars");
  const SOUND_ICON_ON  = "images/Audio.png";
  const SOUND_ICON_OFF = "images/No Audio.png";
  let soundEnabled = localStorage.getItem("rwa-sound") !== "off";

  function applySoundState(){
    document.querySelectorAll("audio, video").forEach(a => { a.muted = !soundEnabled; });
    if (soundToggle){
      soundToggle.src = soundEnabled ? SOUND_ICON_ON : SOUND_ICON_OFF;
      soundToggle.classList.toggle("muted", !soundEnabled);
    }
  }
  applySoundState();

  function playClick(){ if (!soundEnabled || !clickSound) return; clickSound.currentTime = 0; clickSound.play().catch(()=>{}); }
  function playClose(){ if (!soundEnabled || !closeSound) return; closeSound.currentTime = 0; closeSound.play().catch(()=>{}); }

  soundToggle?.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem("rwa-sound", soundEnabled ? "on" : "off");
    applySoundState();
  });
  musicStars?.addEventListener("click", () => {
    if (!music) return;
    if (music.paused) music.play().catch(()=>{}); else music.pause();
  });
  music?.addEventListener("play",  () => musicStars?.classList.add("active"));
  music?.addEventListener("pause", () => musicStars?.classList.remove("active"));

  /* ---------- DARK MODE ---------- */
  if (localStorage.getItem("rwa-mode") === "dark") document.body.classList.add("dark");
  document.getElementById("mode-toggle")?.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("rwa-mode", document.body.classList.contains("dark") ? "dark" : "light");
    playClick();
  });

  /* ---------- EYES ---------- */
  const eyes = document.getElementById("eyes");
  const face = document.querySelector(".hitbox-face");
  if (eyes && face){
    document.addEventListener("mousemove", (e) => {
      const r = face.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      const mx = Math.max(-14, Math.min(14, dx * 0.04));
      const my = Math.max(-6,  Math.min(6,  dy * 0.025));
      eyes.style.transform = `translate(${mx}px, ${my}px)`;
    });
  }

  function isPhoneOrTablet(){ return window.innerWidth <= 1024; }
  function isPhoneScreen(){ return window.innerWidth <= 700; }

  /* ---------- MOBILE DOWN-ARROW IN POPUP HEADERS ---------- */
  document.querySelectorAll(".popup .popup-header").forEach((header) => {
    if (header.querySelector(".mobile-close")) return;
    const arrow = document.createElement("img");
    arrow.src = "images/twodownarrows.png";
    arrow.alt = "Close"; arrow.className = "mobile-close";
    header.insertBefore(arrow, header.firstChild);
    arrow.addEventListener("click", (e) => { e.stopPropagation(); closeWindow(header.closest(".popup")); });
  });

  /* ---------- POPUP WINDOWS ---------- */
  function syncBodyState(){
    document.body.classList.toggle("popup-open", !!document.querySelector(".popup.active"));
  }
  function openWindow(id){
    const el = document.getElementById(id);
    if (!el) return;
    if (isPhoneOrTablet()){
      document.querySelectorAll(".popup.active").forEach(p => { if (p !== el) p.classList.remove("active"); });
    }
    el.classList.add("active");
    bringPopupToFront(el);
    if (!el.dataset.centered){
      el.style.left = "50%"; el.style.top = "50%";
      el.style.transform = "translate(-50%,-50%)";
      el.dataset.centered = "true";
    }
    syncBodyState(); playClick();
  }
  
function closeWindow(el){
  if (!el) return;
  el.classList.remove("active");
  syncBodyState(); playClose();
  document.querySelectorAll(".sticky-note").forEach(s => {
    s.classList.remove("dragging");
    try { if (s.hasPointerCapture && s._pid) s.releasePointerCapture(s._pid); } catch {}
  });
  el.querySelectorAll("textarea, input, [contenteditable='true']").forEach(t => { try { t.blur(); } catch {} });
  if (document.activeElement && el.contains(document.activeElement)) { try { document.activeElement.blur(); } catch {} }
  const sel = window.getSelection && window.getSelection();
  if (sel && sel.removeAllRanges) sel.removeAllRanges();
  document.body.style.userSelect = "";
  document.body.style.webkitUserSelect = "";
}

document.querySelectorAll(".popup .close-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    closeWindow(btn.closest(".popup"));
  });
});

  /* ---------- DRAG POPUP WINDOWS (desktop only) ---------- */
  document.querySelectorAll(".popup").forEach((popup) => {
    const header = popup.querySelector(".popup-header");
    let drag=false, ox=0, oy=0;
    header?.addEventListener("mousedown", (e) => {
      if (isPhoneOrTablet()) return;
      if (e.target.closest(".close-btn") || e.target.closest(".mobile-close")) return;
      drag = true;
      const r = popup.getBoundingClientRect();
      ox = e.clientX - r.left; oy = e.clientY - r.top;
      bringPopupToFront(popup);
    });

document.querySelectorAll(".popup").forEach((popup) => {
  popup.addEventListener("mousedown", () => bringPopupToFront(popup));
});

    document.addEventListener("mousemove", (e) => {
      if (!drag || isPhoneOrTablet()) return;
      popup.style.left = e.clientX - ox + "px";
      popup.style.top  = e.clientY - oy + "px";
      popup.style.transform = "none";
    });
    document.addEventListener("mouseup", () => (drag = false));
  });

  /* ---------- HITBOXES ---------- */
  document.querySelector(".hitbox-face")    ?.addEventListener("click", () => openWindow("facePopup"));
  document.querySelector(".hitbox-links")   ?.addEventListener("click", () => openWindow("linksPopup"));
  document.querySelector(".hitbox-scene")   ?.addEventListener("click", () => openWindow("scenePopup"));
  document.querySelector(".hitbox-projects")?.addEventListener("click", () => openWindow("projectsPopup"));

  /* ---------- FULLSCREEN VIEWER ---------- */
  const viewer      = document.getElementById("viewer");
  const viewerImg   = document.getElementById("viewerImg");
  const viewerVideo = document.getElementById("viewerVideo");
  const viewerClose = document.getElementById("viewerClose");

  function openViewer(src, type){
    viewer.classList.remove("hidden");
    viewer.style.pointerEvents = "auto";
    document.body.style.overflow = "hidden";
    if (type === "img"){
      viewerImg.src = src;
      viewerImg.style.display = "block"; viewerVideo.style.display = "none";
      viewerVideo.pause();
    }
    if (type === "video"){
      viewerVideo.src = src;
      viewerVideo.style.display = "block"; viewerImg.style.display = "none";
      viewerVideo.play().catch(()=>{});
    }
  }
  function closeViewer(){
    viewer.classList.add("hidden");
    document.body.style.overflow = "";
    viewerVideo.pause(); viewerVideo.currentTime = 0;
  }
  function wireGalleryItem(item){
    item.addEventListener("click", (e) => {
      if (item.tagName === "VIDEO"){
        const src = item.currentSrc || item.querySelector("source")?.src;
        if (src){ item.pause(); openViewer(src, "video"); e.preventDefault(); }
      } else if (item.tagName === "IMG"){
        openViewer(item.src, "img");
      }
    });
  }
  document.querySelectorAll(".gallery-item").forEach(wireGalleryItem);
  viewerClose?.addEventListener("click", (e) => { e.stopPropagation(); closeViewer(); });

  /* ---------- AUTO-WRAP PROJECT MEDIA ---------- */
 function createFolderMediaCard(item){
  if (item.closest(".folder-media-card")) return null;

  const card = document.createElement("article");
  const preview = document.createElement("div");

  card.className = "folder-media-card";
  preview.className = "folder-media-preview";

  if (item.tagName === "IMG" || item.tagName === "VIDEO"){
    item.classList.add("gallery-item");

    /* Videos open in the existing fullscreen viewer */
    if (item.tagName === "VIDEO"){
      item.controls = false;
      item.setAttribute("playsinline", "");
      item.preload = "metadata";
    }

    preview.appendChild(item);
    wireGalleryItem(item);
  } else {
    const filePreview = document.createElement("div");
    filePreview.className = "folder-file-preview";
    filePreview.textContent = "FILE";

    preview.appendChild(filePreview);
    item.classList.add("folder-file");
    card.appendChild(item);
  }

  card.appendChild(preview);
  return card;
}

function arrangeProjectFolderMedia(page){
  if (!page || page.id === "projectsHome") return;

  const mediaItems = Array.from(page.children).filter(item =>
    (
      item.tagName === "IMG" ||
      item.tagName === "VIDEO" ||
      (item.tagName === "A" && item.classList.contains("folder-file"))
    ) &&
    !item.classList.contains("play-btn")
  );

  if (!mediaItems.length) return;

  let grid = page.querySelector(":scope > .folder-media-grid");
  if (!grid){
    grid = document.createElement("div");
    grid.className = "folder-media-grid";
    page.appendChild(grid);
  }

  mediaItems.forEach(item => {
    const card = createFolderMediaCard(item);
    if (card) grid.appendChild(card);
  });
}

function arrangeAllProjectFolderMedia(){
  document
    .querySelectorAll("#projectsPopup .projects-page")
    .forEach(arrangeProjectFolderMedia);
}

/* Arrange the folders that already exist */
arrangeAllProjectFolderMedia();

/* Also arrange content added to future folders */
const projectsContent = document.querySelector("#projectsPopup .projects-desktop");

if (projectsContent){
  const folderMediaObserver = new MutationObserver(() => {
    arrangeAllProjectFolderMedia();
  });

  folderMediaObserver.observe(projectsContent, {
    childList: true,
    subtree: true
  });
}

/* ---------- BACK BUTTON ---------- */

const backBtn = document.getElementById("projectsBackBtn");

window.openProjectPage = function(pageId, folder){
  document.querySelectorAll("#projectsPopup .projects-page").forEach(p => p.classList.remove("active"));
  document.getElementById(pageId)?.classList.add("active");

  document.querySelectorAll("#projectsPopup .folder").forEach(f => f.classList.remove("open"));
  folder?.classList.add("open");

  if (backBtn) backBtn.style.display = "block";

  playClick();
};

if (backBtn){
  backBtn.onclick = () => {
    document.querySelectorAll("#projectsPopup .projects-page").forEach(p => p.classList.remove("active"));
    document.getElementById("projectsHome").classList.add("active");

    document.querySelectorAll("#projectsPopup .folder").forEach(f => f.classList.remove("open"));

    backBtn.style.display = "none";

    playClose();
  };
}

  /* ---------- "More about me" ---------- */
  document.getElementById("artistMoreBtn")?.addEventListener("click", () => {
    document.getElementById("artistMoreText")?.classList.toggle("open");
  });

   /* ---------- MINI APPS ---------- */
  window.openPaintApp    = () => openWindow("paintApp");
  window.openNotesApp    = () => openWindow("notesApp");
  window.openPetApp      = () => openWindow("petApp");
  window.openFeedbackApp = () => openWindow("feedbackApp");

  // expose the shared window helpers so the Settings module uses the exact same ones
  window.openWindow  = openWindow;
  window.closeWindow = closeWindow;


  /* ---------- PAINT ---------- */
  const canvas = document.getElementById("paintCanvas");
if (canvas){
  const ctx = canvas.getContext("2d");
  const color = document.getElementById("colorPicker");
  const size  = document.getElementById("brushSize");
  let paint=false, lastX=0, lastY=0;

  function paintWhiteBackground(){
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // Match the internal pixel buffer to the displayed CSS size.
  // Preserve any existing drawing across resizes.
  function fitCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr  = window.devicePixelRatio || 1;
    const targetW = Math.max(1, Math.round(rect.width  * dpr));
    const targetH = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width === targetW && canvas.height === targetH) return;

    // Save current pixels to restore after resize
    let snapshot = null;
    if (canvas.width && canvas.height){
      snapshot = document.createElement("canvas");
      snapshot.width = canvas.width; snapshot.height = canvas.height;
      snapshot.getContext("2d").drawImage(canvas, 0, 0);
    }

    canvas.width  = targetW;
    canvas.height = targetH;
    paintWhiteBackground();

    if (snapshot){
      ctx.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height,
                              0, 0, canvas.width,  canvas.height);
    }
    // Scale drawing so 1 CSS px = 1 logical unit
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Initial white fill + size to display
  requestAnimationFrame(fitCanvas);
  window.addEventListener("resize", fitCanvas);
  // Also refit when the paint popup is opened (size changes from display:none)
  const paintObserver = new MutationObserver(() => {
    if (document.getElementById("paintApp")?.classList.contains("active")){
      requestAnimationFrame(fitCanvas);
    }
  });
  paintObserver.observe(document.getElementById("paintApp"), { attributes: true, attributeFilter: ["class"] });

  function startDraw(x,y){ paint=true; lastX=x; lastY=y; }
  function doDraw(x,y){
    if (!paint) return;
    ctx.lineWidth = size.value;
    ctx.strokeStyle = color.value;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    lastX=x; lastY=y;
  }
  function endDraw(){ paint=false; }

  canvas.addEventListener("mousedown",  e => startDraw(e.offsetX, e.offsetY));
  canvas.addEventListener("mousemove",  e => doDraw(e.offsetX, e.offsetY));
  canvas.addEventListener("mouseup",    endDraw);
  canvas.addEventListener("mouseleave", endDraw);
  canvas.addEventListener("touchstart", e => {
    const r=canvas.getBoundingClientRect(), t=e.touches[0];
    startDraw(t.clientX-r.left, t.clientY-r.top); e.preventDefault();
  }, {passive:false});
  canvas.addEventListener("touchmove", e => {
    const r=canvas.getBoundingClientRect(), t=e.touches[0];
    doDraw(t.clientX-r.left, t.clientY-r.top); e.preventDefault();
  }, {passive:false});
  canvas.addEventListener("touchend", endDraw);

  window.clearCanvas = () => {
    ctx.setTransform(1,0,0,1,0,0);
    paintWhiteBackground();
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  window.saveCanvas  = () => {
    const link = document.createElement("a");
    link.download = "my-painting.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };
}

  /* =========================================================
     NOTES APP — list + detail + home stickies
  ========================================================= */
  const PW_KEY    = "rwa-notes-pw";
  const NOTES_KEY = "rwa-notes-v2";

  const lockScreen  = document.getElementById("notesLockScreen");
  const editor      = document.getElementById("notesEditor");
  const pwInput     = document.getElementById("notesPassword");
  const unlockBtn   = document.getElementById("notesUnlockBtn");
  const setPwBtn    = document.getElementById("notesSetPwBtn");
  const lockBtn     = document.getElementById("lockNotesBtn");
  const lockMsg     = document.getElementById("notesLockMsg");
  const lockStatus  = document.getElementById("notesLockStatus");
  const listPage    = document.getElementById("notesListPage");
  const detailPage  = document.getElementById("notesDetailPage");
  const notesListEl = document.getElementById("notesList");
  const newNoteBtn  = document.getElementById("newNoteBtn");
  const notesBackEl = document.getElementById("notesBackBtn");
  const notesArea   = document.getElementById("notesArea");
  const saveBtn     = document.getElementById("saveNoteBtn");
  const pinBtn      = document.getElementById("pinNoteBtn");
  const delBtn      = document.getElementById("deleteNoteBtn");
  const nStat       = document.getElementById("notesStatus");
  const stickyLayer = document.getElementById("stickyLayer");

  let currentNoteId = null;

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }
  function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NOTES_KEY) || "[]"); }catch{ return []; } }
  function saveNotesArr(arr){ localStorage.setItem(NOTES_KEY, JSON.stringify(arr)); renderHomeStickies(); }
  function patchNote(id, patch, opts = {}){
  const arr = loadNotes().map(n => n.id===id ? {...n, ...patch} : n);
  localStorage.setItem(NOTES_KEY, JSON.stringify(arr));
  if (!opts.skipRender) renderHomeStickies();}
  function removeNote(id){ saveNotesArr(loadNotes().filter(n => n.id !== id)); }

  /* one-time migration from old keys */
  (function migrate(){
    if (localStorage.getItem(NOTES_KEY)) return;
    const old = localStorage.getItem("myNotes");
    let extras = [];
    try{ extras = JSON.parse(localStorage.getItem("rwa-extra-stickies") || "[]"); }catch{}
    const arr = [];
    if (old) arr.push({
      id:"n_"+Date.now(), text:old,
      color: localStorage.getItem("rwa-sticky-color") || "#fff7a8",
      visible: localStorage.getItem("rwa-sticky-visible") === "1",
      pinned:  localStorage.getItem("rwa-sticky-locked")  === "1",
      x:60, y:140
    });
    extras.forEach(e => arr.push({
      id:e.id, text:e.text||"", color:e.color||"#fff7a8",
      visible:true, pinned:false, x:e.x, y:e.y, w:e.w, h:e.h
    }));
    if (arr.length) localStorage.setItem(NOTES_KEY, JSON.stringify(arr));
  })();

  function showLocked(){
    const hasPw = !!localStorage.getItem(PW_KEY);
    const ico = '<img src="images/Lock.png" alt="" class="inline-icon" />';
    lockMsg.innerHTML = hasPw ? `${ico} These notes are private.` : `${ico} Set a password to protect your notes.`;
    unlockBtn.style.display = hasPw ? "inline-block" : "none";
    setPwBtn.style.display  = hasPw ? "none" : "inline-block";
    lockScreen.style.display = "flex"; editor.style.display = "none";
    if (pwInput){ pwInput.value=""; pwInput.focus(); }
  }
  function showEditor(){ lockScreen.style.display="none"; editor.style.display="flex"; goToList(); }
  if (lockScreen && editor) showLocked();

  unlockBtn?.addEventListener("click", () => {
    if (pwInput.value === localStorage.getItem(PW_KEY)){ lockStatus.innerText=""; showEditor(); }
    else lockStatus.innerText = "Wrong password ✕";
  });
  setPwBtn?.addEventListener("click", () => {
    if (!pwInput.value){ lockStatus.innerText="Pick a password first"; return; }
    localStorage.setItem(PW_KEY, pwInput.value);
    lockStatus.innerText="Password set ✓";
    setTimeout(showEditor, 400);
  });
  pwInput?.addEventListener("keydown", e => {
    if (e.key==="Enter") (localStorage.getItem(PW_KEY)?unlockBtn:setPwBtn).click();
  });
  lockBtn?.addEventListener("click", showLocked);

  function goToList(){
    detailPage.classList.remove("active");
    listPage.classList.add("active");
    currentNoteId = null;
    renderList();
  }
  function goToDetail(id){
    const n = loadNotes().find(x => x.id === id);
    if (!n) return goToList();
    currentNoteId = id;
    notesArea.value = n.text || "";
    document.querySelectorAll("#notesDetailPage .color-swatch").forEach(b => {
      b.classList.toggle("selected", b.dataset.color === n.color);
    });
    pinBtn.innerHTML = n.visible
      ? '<img src="images/Pin.png" class="inline-icon" />Hide from home'
      : '<img src="images/Pin.png" class="inline-icon" />Show on home';
    listPage.classList.remove("active");
    detailPage.classList.add("active");
  }
  notesBackEl?.addEventListener("click", goToList);

  function renderList(){
    const arr = loadNotes();
    notesListEl.innerHTML = "";
    if (!arr.length){
      notesListEl.innerHTML = `<p style="opacity:.7;text-align:center;padding:20px;">No notes yet. Tap "+ New note" to start ✨</p>`;
      return;
    }
    arr.forEach(n => {
      const el = document.createElement("div");
      el.className = "note-list-item";
      el.style.setProperty("--note-bg", n.color || "#fff7a8");
      el.style.background = n.color || "#fff7a8";
      el.innerHTML = `
        <div class="nli-preview">${escapeHtml(n.text || "")}</div>
        <div class="nli-tags">${n.visible ? " on home" : "in notebook"}${n.pinned ? " · locked" : ""}</div>
      `;
      el.addEventListener("click", () => goToDetail(n.id));
      notesListEl.appendChild(el);
    });
  }

  newNoteBtn?.addEventListener("click", () => {
    const arr = loadNotes();
    const n = {
      id:"n_"+Date.now()+"_"+Math.floor(Math.random()*999),
      text:"", color:"#fff7a8", visible:false, pinned:false,
      x: 80 + Math.random()*200, y: 160 + Math.random()*80
    };
    arr.push(n); saveNotesArr(arr); goToDetail(n.id);
  });
