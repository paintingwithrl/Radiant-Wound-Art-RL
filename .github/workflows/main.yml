    paw:'<svg viewBox="0 0 24 24"><circle cx="6" cy="10" r="2"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><circle cx="18" cy="10" r="2"/><path d="M8 16c0-2.5 1.8-4 4-4s4 1.5 4 4-1.8 4-4 4-4-1.5-4-4z"/></svg>',
    sound:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>',
    move:'<svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/></svg>',
    droplet:'<svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
    spotify:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 10c3-1 7-.8 10 1M7.5 13.5c2.5-.8 5.5-.6 8 .8M8 16.5c2-.6 4-.4 6 .5"/></svg>',
  };
  const icon = (n) => ICONS[n] || ICONS.gear;

  const CATEGORIES = [
    { id:'theme',    title:'Web Theme',             icon:'theme',    sub:'Colors, gradients, positions & images' },
    { id:'artist',   title:'Artist pop-up',         icon:'artist',   sub:'Photo, bio, bag, things I enjoy' },
    { id:'scene',    title:'Scene pop-up',          icon:'scene',    sub:'Painting, digital, video sections' },
    { id:'links',    title:'Links pop-up',          icon:'links',    sub:'Bubble text & social links' },
    { id:'projects', title:'More projects',         icon:'projects', sub:'Project folders & their contents' },
    { id:'music',    title:'Music / Stars settings',icon:'music',    sub:'Track queue, sounds & Spotify' },
    { id:'apps',     title:'Apps settings',         icon:'apps',     sub:'Paint, Feedback, Notes, Goals, Pet' },
  ];

  const panel = () => document.getElementById('rwaPanel');
  const isPortrait = () => window.matchMedia('(max-width: 900px) and (orientation:portrait), (max-width: 768px)').matches;
  const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

  let activeCat = 'theme';

  onReady(initSettings);
  function initSettings() {
    if (!panel()) return;
    syncDark(); renderSidebar(); renderSidebarFooter(); renderMobileShell();
    openCategory('theme'); showMobileList();
    bindSpotify();
  }

  function syncDark() {
    const root = document.getElementById('rwaSetRoot'); if (!root) return;
    const apply = () => root.classList.toggle('rwa-dark', isDark());
    apply(); new MutationObserver(apply).observe(document.body, { attributes:true, attributeFilter:['class'] });
  }

  /* ---- desktop sidebar ---- */
  function renderSidebar() {
    const nav = q('.rwa-sidebar-nav', panel()); nav.innerHTML = '';
    CATEGORIES.forEach((cat, i) => {
    const b = el(`<button class="rwa-tab-btn" data-cat="${cat.id}"><span class="rwa-tab-icon rwa-c${i % 8}">${icon(cat.icon)}</span><span class="rwa-tab-label">${cat.title}</span><span class="rwa-arrow">\u2192</span></button>`);
      b.addEventListener('click', () => openCategory(cat.id));
      nav.appendChild(b);
    });
  }
  function actionBtn(label, ic, fn) {
    const b = el(`<button type="button" class="rwa-footer-btn">${icon(ic)}<span>${label}</span></button>`);
    b.addEventListener('click', fn); return b;
  }

  function resetConfig() {
    if (!confirm('Reset ALL settings back to how they were originally? Your notes and goals are kept.')) return;
    API.reset();
    applyAll();
    try { openCategory(activeCat); } catch (_) {}
    alert('Settings reset \u2713');
  }

  function renderSidebarFooter() {
    const foot = q('.rwa-sidebar-footer', panel()); foot.innerHTML = '';
    foot.append(actionBtn('Lock','gear',lockSettings), actionBtn('Export','move',exportConfig), actionBtn('Import','plus',importConfig));
  }

  /* ---- portrait shell ---- */
  function renderMobileShell() {
    const m = q('.rwa-mobile-view', panel());
    m.innerHTML = `
      <div class="rwa-mobile-list">
        <h2 class="rwa-mobile-title">Settings</h2>
        <div class="rwa-card-list"></div>
        <div class="rwa-mobile-footer"></div>
      </div>
      <div class="rwa-mobile-detail" hidden>
        <div class="rwa-mobile-detail-head"><button type="button" class="rwa-back-btn">\u2039 Back</button><h3></h3></div>
        <div class="rwa-mobile-detail-body"></div>
      </div>`;
    const list = q('.rwa-card-list', m);
    CATEGORIES.forEach((cat, i) => {
      const card = optionCard(cat.title, cat.sub, cat.icon, i, () => openCategory(cat.id));
      list.appendChild(card);
    });
    const foot = q('.rwa-mobile-footer', m);
    foot.append(actionBtn('Lock','gear',lockSettings), actionBtn('Export','move',exportConfig), actionBtn('Import','plus',importConfig));
    q('.rwa-back-btn', m).addEventListener('click', () => {
      // back from detail -> category hub list (Settings list)
      showMobileList();
    });
  }
  function showMobileList() {
    const m = q('.rwa-mobile-view', panel()); if (!m) return;
    q('.rwa-mobile-detail', m).hidden = true; q('.rwa-mobile-list', m).hidden = false;
  }
  function showMobileDetail(title, buildFn, backFn) {
    const m = q('.rwa-mobile-view', panel());
    q('.rwa-mobile-list', m).hidden = true;
    const d = q('.rwa-mobile-detail', m); d.hidden = false;
    q('h3', d).textContent = title;
    const body = q('.rwa-mobile-detail-body', d); body.innerHTML = '';
    q('.rwa-back-btn', d).onclick = backFn || showMobileList;
    buildFn(body);
  }

  /* ---- option card factory ---- */
  function optionCard(title, sub, ic, colorIdx, onClick) {
    const c = el(`<button class="rwa-option-card">
      <span class="rwa-option-icon rwa-c${colorIdx % 8}">${icon(ic)}</span>
      <span class="rwa-option-text"><span class="rwa-option-title">${title}</span><span class="rwa-option-sub">${sub}</span></span>
      <span class="rwa-option-chevron">\u203a</span></button>`);
    c.addEventListener('click', onClick); return c;
  }

  /* ---- open a category (shows its hub of sub-cards) ---- */
  function openCategory(id) {
    activeCat = id;
    const cat = CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
    qa('.rwa-tab-btn', panel()).forEach((b) => b.classList.toggle('active', b.dataset.cat === cat.id));
    q('#rwaMainTitle').textContent = cat.title;
    q('#rwaMainSub').textContent = 'Tap a card to configure this section.';
    renderHub(q('.rwa-main-body', panel()), id, false);
    if (isPortrait()) showMobileDetail(cat.title, (body) => renderHub(body, id, true), showMobileList);
  }

  /* ---- render the sub-card hub for a category ---- */
  function renderHub(host, catId, portrait) {
    host.innerHTML = '';
    const list = el('<div class="rwa-card-list"></div>'); host.appendChild(list);
    const cards = subCards(catId);
    cards.forEach((sc, i) => {
      const card = optionCard(sc.title, sc.desc, sc.icon, sc.colorIdx != null ? sc.colorIdx : i, () => openEditor(catId, sc, portrait));
      list.appendChild(card);
    });
  }

  /* ---- open a specific editor (drill-down) ---- */
  function openEditor(catId, sc, portrait) {
    const cat = CATEGORIES.find((c) => c.id === catId);
    if (portrait) {
      showMobileDetail(sc.title, (body) => sc.render(body), () => openCategory(catId));
    } else {
      const host = q('.rwa-main-body', panel()); host.innerHTML = '';
      const back = el(`<button class="rwa-editor-back">\u2039 ${cat.title}</button>`);
      back.addEventListener('click', () => openCategory(catId));
      host.appendChild(back);
      host.appendChild(el(`<h3 class="rwa-editor-title">${sc.title}</h3>`));
      const body = el('<div></div>'); host.appendChild(body); sc.render(body);
    }
  }

  /* ---- lock / export / import ---- */
  function lockSettings() { if (typeof global.rwaLockSettings === 'function') global.rwaLockSettings(); }
  function exportConfig() { API.exportFile('rwa-settings.json'); }
  function importConfig() {
    const inp = document.getElementById('rwaImportFile'); if (!inp) return;
    inp.value = ''; inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      if (!confirm('Import will replace ALL current website settings & content. Continue?')) return;
      API.importFile(f).then(() => { applyAll(); openCategory(activeCat); alert('Import complete \u2713'); })
        .catch((e) => alert('Import failed: ' + e.message));
    };
    inp.click();
  }

  /* =========================================================
     EDITOR CONTROL BUILDERS
     ========================================================= */
  function status(host) { const s = el('<div class="rwa-status"></div>'); host.appendChild(s);
    return (msg, ok = true) => { s.textContent = msg; s.className = 'rwa-status ' + (ok ? 'ok' : 'err'); if (ok) setTimeout(() => { s.textContent = ''; }, 1800); }; }

  function field(label, inner) { return el(`<label class="rwa-field"><span>${label}</span>${inner}</label>`); }
  function group(t) { return el(`<div class="rwa-group-title">${t}</div>`); }

  function textField(host, label, path, area) {
    const val = API.get(path) ?? '';
    const f = field(label, area
      ? `<textarea class="rwa-textarea">${esc(val)}</textarea>`
      : `<input class="rwa-input" type="text" value="${esc(val)}">`);
    const inp = q('input,textarea', f);
    const st = status(host);
    inp.addEventListener('input', () => { try { API.set(path, inp.value); st('Saved \u2713'); } catch (e) { st('Save failed: ' + e.message, false); } });
    host.appendChild(f);
  }

  // multi-line bullet list bound to artist.aboutList
  function aboutListField(host) {
    const val = (API.get('artist.aboutList') || []).join('\n');
    const f = field('Bullet list', `<textarea class="rwa-textarea">${esc(val)}</textarea>`);
    const ta = q('textarea', f); const st = status(host);
    ta.addEventListener('input', () => { const arr = ta.value.split('\n').map((x) => x.trim()).filter(Boolean); API.set('artist.aboutList', arr); st('Saved \u2713'); });
    host.appendChild(f);
  }

  function numberField(host, label, path) {
    const f = field(label, `<input class="rwa-input" type="number" value="${esc(API.get(path))}">`);
    const inp = q('input', f); const st = status(host);
    inp.addEventListener('change', () => { const n = Number(inp.value); if (Number.isNaN(n)) return st('Enter a number', false); API.set(path, n); st('Saved \u2713'); });
    host.appendChild(f);
  }

  function colorField(host, label, path) {
    const val = API.get(path) || '#ffffff';
    const f = field(label, `<div class="rwa-color-row"><input type="color" value="${esc(val)}"><input type="text" class="rwa-input" style="max-width:140px" value="${esc(val)}"></div>`);
    const [pick, hex] = qa('input', f);
    pick.addEventListener('input', () => { hex.value = pick.value; API.set(path, pick.value); });
    hex.addEventListener('change', () => { pick.value = hex.value; API.set(path, hex.value); });
    host.appendChild(f);
  }

  function toggleField(host, label, path) {
    const f = el(`<label class="rwa-field rwa-check"><input type="checkbox" ${API.get(path) ? 'checked' : ''}><span>${label}</span></label>`);
    q('input', f).addEventListener('change', (e) => API.set(path, e.target.checked));
    host.appendChild(f);
  }

  function rangeField(host, label, path, min, max, step, suffix) {
    const val = API.get(path);
    const f = field(label, `<div class="rwa-gradient-row"><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><span class="rwa-angle-label">${val}${suffix||''}</span></div>`);
    const r = q('input', f), lbl = q('.rwa-angle-label', f);
    r.addEventListener('input', () => { lbl.textContent = r.value + (suffix||''); API.set(path, Number(r.value)); });
    host.appendChild(f);
  }

  // image control: preview + Upload + path
  function imageControl(host, label, getSrc, setSrc) {
    const val = getSrc() || '';
    const card = el(`<div class="rwa-img-card">
      <span class="rwa-img-thumb"><img alt="" src="${esc(val)}"></span>
      <span class="rwa-img-meta">
        <span class="rwa-img-name">${label}</span>
        <input class="rwa-input" type="text" value="${esc(val)}" placeholder="images/\u2026">
        <span class="rwa-img-actions">
          <button type="button" class="rwa-btn rwa-btn-primary rwa-up">Change / Upload</button>
        </span>
      </span></div>`);
    const img = q('img', card), pathInp = q('input', card), upBtn = q('.rwa-up', card);
    const st = status(host);
    const commit = (src) => { try { setSrc(src); img.src = src; pathInp.value = src; st('Saved \u2713'); } catch (e) { st('Save failed', false); } };
    pathInp.addEventListener('change', () => commit(pathInp.value));
    upBtn.addEventListener('click', () => {
      const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*';
      fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader();
        r.onload = () => commit(r.result); r.onerror = () => st('Could not read file', false); r.readAsDataURL(f); };
      fi.click();
    });
    host.appendChild(card);
  }

  // list editor with drag reorder, image thumb, title, delete (confirmed)
  function listEditor(host, path, opts) {
    opts = opts || {};
    const wrap = el('<div class="rwa-sub-list"></div>'); host.appendChild(wrap);
    const addBtn = el(`<button type="button" class="rwa-add-btn">${opts.addLabel || '+ Add item'}</button>`); host.appendChild(addBtn);
    const render = () => {
      wrap.innerHTML = '';
      const items = API.get(path) || [];
      if (!items.length) wrap.appendChild(el('<p class="rwa-empty">Nothing here yet.</p>'));
      items.forEach((item) => {
        const row = el('<div class="rwa-sub-item" draggable="true"></div>');
        row.dataset.id = item.id;
        row.appendChild(el('<span class="rwa-drag" title="Drag to reorder">\u2630</span>'));
        if (opts.image) {
          const th = el(`<img class="rwa-sub-thumb" src="${esc(item[opts.image] || '')}" alt="">`);
          const up = el('<button type="button" class="rwa-icon-btn" title="Change image">\u{1F5BC}</button>');
          up.addEventListener('click', () => { const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*';
            fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => API.listUpdate(path, item.id, { [opts.image]: r.result }); r.readAsDataURL(f); }; fi.click(); });
          row.append(th, up);
        }
        (opts.fields || ['label']).forEach((fname) => {
          const inp = el(`<input class="rwa-input" placeholder="${fname}" value="${esc(item[fname] || '')}">`);
          inp.addEventListener('change', () => API.listUpdate(path, item.id, { [fname]: inp.value }));
          row.appendChild(inp);
        });
        const rm = el('<button type="button" class="rwa-icon-btn rwa-del" title="Delete">\u2715</button>');
        rm.addEventListener('click', () => { if (confirm(`Delete "${item[opts.fields ? opts.fields[0] : 'label'] || 'this item'}"? This cannot be undone.`)) API.listRemove(path, item.id); });
        row.appendChild(rm);
        // drag reorder
        row.addEventListener('dragstart', () => row.classList.add('rwa-dragging'));
        row.addEventListener('dragend', () => { row.classList.remove('rwa-dragging'); const ids = qa('.rwa-sub-item', wrap).map((r) => r.dataset.id); API.listReorder(path, ids); });
        wrap.appendChild(row);
      });
    };
    wrap.addEventListener('dragover', (e) => { e.preventDefault();
      const dragging = q('.rwa-dragging', wrap); if (!dragging) return;
      const after = [...qa('.rwa-sub-item:not(.rwa-dragging)', wrap)].find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
      if (after) wrap.insertBefore(dragging, after); else wrap.appendChild(dragging);
    });
    addBtn.addEventListener('click', () => { const item = {}; (opts.fields || ['label']).forEach((f) => item[f] = ''); if (opts.image) item[opts.image] = ''; if (opts.defaults) Object.assign(item, opts.defaults); API.listAdd(path, item); });
    render(); API.subscribe(path, render);
  }

  /* =========================================================
     SUB-CARDS PER CATEGORY
     ========================================================= */
  function subCards(catId) {
    switch (catId) {
      case 'theme': return [
        { title:'Background color', desc:'Light & dark background + gradient', icon:'droplet', colorIdx:0, render:themeBackground },
        { title:'Frame color', desc:'Light & dark frame + gradient', icon:'brush', colorIdx:1, render:themeFrame },
        { title:'Position of elements', desc:'Move homepage elements', icon:'move', colorIdx:2, render:themePositions },
        { title:'Change pictures of elements', desc:'Swap homepage images', icon:'image', colorIdx:3, render:themeImages },
      ];
      case 'artist': return [
        { title:'"Meet the artist" image', desc:'Change the portrait', icon:'image', colorIdx:0, render:(h)=>imageControl(h,'Meet the artist image',()=>API.get('artist.meetImage'),(v)=>API.set('artist.meetImage',v)) },
        { title:'Bag images', desc:'Edit, reorder, add bag items', icon:'bag', colorIdx:1, render:(h)=>listEditor(h,'artist.bag',{fields:['label'],image:'img',addLabel:'+ Add bag item'}) },
        { title:'"Items I enjoy" images', desc:'Edit, reorder, add items', icon:'heart', colorIdx:2, render:(h)=>listEditor(h,'artist.enjoy',{fields:['label'],image:'img',addLabel:'+ Add item'}) },
        { title:'Edit "Meet the artist" text', desc:'Name, pronouns & bullet list', icon:'text', colorIdx:3, render:(h)=>{textField(h,'Label','artist.meetText');textField(h,'Name','artist.name');textField(h,'Pronouns','artist.pronouns');h.appendChild(group('Bullet list (one line = one bullet)'));aboutListField(h);} },
        { title:'Edit "More about me" text', desc:'The expandable bio', icon:'text', colorIdx:4, render:(h)=>textField(h,'More about me','artist.moreText',true) },
        { title:'Edit last text', desc:'Closing paragraph', icon:'text', colorIdx:5, render:(h)=>textField(h,'Last text','artist.endingText',true) },
      ];
      case 'scene': {
        const secs = API.get('sceneSections') || [];
        const cards = secs.map((s, i) => ({ title:s.title + ' section', desc:'Manage ' + s.title.toLowerCase(), icon:(s.items&&s.items[0]&&s.items[0].type==='video')?'video':'image', colorIdx:i, render:(h)=>sceneSectionEditor(h, s.id) }));
        cards.push({ title:'Add more sections', desc:'Create a new section', icon:'plus', colorIdx:3, render:sceneAddSection });
        return cards;
      }
      case 'links': return [
        { title:'Manage links', desc:'Icons, titles, URLs & order', icon:'links', colorIdx:0, render:linksManage },
        { title:'Edit bubble text', desc:'The speech-bubble message', icon:'chat', colorIdx:1, render:(h)=>textField(h,'Bubble text','links.bubbleText') },
      ];
      case 'projects': {
        const folders = API.get('projects.folders') || [];
        const cards = folders.map((f, i) => ({ title:f.title, desc:'Edit existing project folders', icon:'folder', colorIdx:i, render:(h)=>projectFolderEditor(h, f.id) }));
        cards.push({ title:'Add new folder', desc:'Create a new project folder', icon:'folderPlus', colorIdx:7, render:projectAddFolder });
        return cards;
      }
      case 'music': return [
        { title:'Three-Star music', desc:'Queue, order, add & replace', icon:'music', colorIdx:0, render:musicQueueEditor },
        { title:'System sounds', desc:'Click & close sounds', icon:'sound', colorIdx:1, render:systemSoundsEditor },
        { title:'Spotify mini-player', desc:'Playlist for the 3-star player', icon:'spotify', colorIdx:3, render:spotifyEditor },
      ];
      case 'apps': return [
        { title:'Painting App', desc:'Icon, canvas size & tools', icon:'brush', colorIdx:0, render:appPainting },
        { title:'Feedback App', desc:'Icon & how feedback is sent', icon:'chat', colorIdx:3, render:appFeedback },
        { title:'Notes App', desc:'Icon, sticky colors & background', icon:'note', colorIdx:5, render:appNotes },
        { title:'Goals App', desc:'Icons & widget colors', icon:'star', colorIdx:7, render:appGoals },
        { title:'Pet App', desc:'Icon & moods', icon:'paw', colorIdx:6, render:appPet },
      ];
      default: return [];
    }
  }

  /* ---------- THEME EDITORS ---------- */
  function bgPreview() {
    const box = el('<div class="rwa-mini-preview"><span class="rwa-mini-label">Live preview</span></div>');
    const paint = () => { const t = API.get('theme'), dark = isDark();
      const bg = dark ? t.darkBg : t.lightBg, g = dark ? t.darkBgGrad : t.lightBgGrad;
      box.style.background = (g && g.on) ? `linear-gradient(${g.angle}deg,${bg},${g.color2})` : bg; };
    paint(); API.subscribe('theme', paint); return box;
  }
  function framePreview() {
    const box = el('<div class="rwa-mini-preview" style="background:#3a1a5e"><div class="rwa-mini-frame"></div><span class="rwa-mini-label">Live preview</span></div>');
    const fr = box.querySelector('.rwa-mini-frame');
    const paint = () => { const t = API.get('theme'), dark = isDark();
      const c = dark ? t.darkFrame : t.lightFrame, g = dark ? t.darkFrameGrad : t.lightFrameGrad;
      fr.style.background = (g && g.on) ? `linear-gradient(${g.angle}deg,${c},${g.color2})` : c; };
    paint(); API.subscribe('theme', paint); return box;
  }
  
  function themeBackground(host) {
  host.appendChild(bgPreview());

  host.appendChild(group('Light mode'));
  colorField(host, 'Light background', 'theme.lightBg');
  colorField(host, 'Light frame-cover circles', 'theme.lightCover');
  toggleField(host, 'Use gradient (light)', 'theme.lightBgGrad.on');
  colorField(host, 'Light gradient 2nd color', 'theme.lightBgGrad.color2');
  rangeField(host, 'Light gradient angle', 'theme.lightBgGrad.angle', 0, 360, 1, '\u00b0');

  host.appendChild(group('Dark mode'));
  colorField(host, 'Dark background', 'theme.darkBg');
  colorField(host, 'Dark frame-cover circles', 'theme.darkCover');
  toggleField(host, 'Use gradient (dark)', 'theme.darkBgGrad.on');
  colorField(host, 'Dark gradient 2nd color', 'theme.darkBgGrad.color2');
  rangeField(host, 'Dark gradient angle', 'theme.darkBgGrad.angle', 0, 360, 1, '\u00b0');

  host.appendChild(group('Text'));
  colorField(host, 'Light text', 'theme.lightText');
  colorField(host, 'Dark text', 'theme.darkText');

  host.appendChild(group('Section dividers'));
  colorField(host, 'Light divider color', 'theme.lightDivider');
  colorField(host, 'Dark divider color', 'theme.darkDivider');
}

  function themeFrame(host) {
    host.appendChild(framePreview());
    host.appendChild(group('Light mode'));
    colorField(host, 'Light frame color', 'theme.lightFrame');
    toggleField(host, 'Use gradient (light)', 'theme.lightFrameGrad.on');
    colorField(host, 'Light gradient 2nd color', 'theme.lightFrameGrad.color2');
    rangeField(host, 'Light gradient angle', 'theme.lightFrameGrad.angle', 0, 360, 1, '\u00b0');
    host.appendChild(group('Dark mode'));
    colorField(host, 'Dark frame color', 'theme.darkFrame');
    toggleField(host, 'Use gradient (dark)', 'theme.darkFrameGrad.on');
    colorField(host, 'Dark gradient 2nd color', 'theme.darkFrameGrad.color2');
    rangeField(host, 'Dark gradient angle', 'theme.darkFrameGrad.angle', 0, 360, 1, '\u00b0');
  }
  function themePositions(host) {
    host.appendChild(el('<p class="rwa-editor-hint">Drag a dot, or type exact pixel values. Changes apply to the homepage instantly.</p>'));
    const pad = el('<div class="rwa-pos-pad"></div>'); host.appendChild(pad);
    const defs = [['scene','S','Scene'],['linkStar','L','Link star'],['projects','P','More projects'],['face','F','Face']];
    defs.forEach(([key, letter, name]) => {
      const cur = API.get('positions.' + key) || {};
      const row = el(`<div class="rwa-field"><span>${name}</span><div class="rwa-gradient-row">X <input class="rwa-input" style="max-width:100px" type="number" value="${cur.x ?? ''}"> Y <input class="rwa-input" style="max-width:100px" type="number" value="${cur.y ?? ''}"><button type="button" class="rwa-btn rwa-btn-ghost rwa-rst">Reset</button></div></div>`);
      const [xi, yi] = qa('input', row);
      const commit = () => API.set('positions.' + key, { x: xi.value === '' ? null : +xi.value, y: yi.value === '' ? null : +yi.value });
      xi.addEventListener('change', commit); yi.addEventListener('change', commit);
      q('.rwa-rst', row).addEventListener('click', () => { API.reset('positions.' + key); xi.value = ''; yi.value = ''; place(); });
      host.appendChild(row);
      const node = el(`<div class="rwa-pos-node">${letter}</div>`); pad.appendChild(node);
      function place() { const c = API.get('positions.' + key) || {}; node.style.left = ((c.x ?? 120) / Math.max(window.innerWidth,1) * 100) + '%'; node.style.top = ((c.y ?? 120) / Math.max(window.innerHeight,1) * 100) + '%'; }
      requestAnimationFrame(place);
      let drag = false;
      node.addEventListener('pointerdown', (e) => { drag = true; node.setPointerCapture(e.pointerId); node.classList.add('dragging'); });
      node.addEventListener('pointermove', (e) => { if (!drag) return; const r = pad.getBoundingClientRect();
        const px = Math.min(Math.max(e.clientX - r.left, 0), r.width), py = Math.min(Math.max(e.clientY - r.top, 0), r.height);
        node.style.left = (px / r.width * 100) + '%'; node.style.top = (py / r.height * 100) + '%';
        const x = Math.round(px / r.width * window.innerWidth), y = Math.round(py / r.height * window.innerHeight);
        xi.value = x; yi.value = y; API.set('positions.' + key, { x, y }); });
      node.addEventListener('pointerup', () => { drag = false; node.classList.remove('dragging'); });
    });
  }
  function themeImages(host) {
    const imgs = [
      ['Scene image (light)','sceneLight'],['Scene image (dark)','sceneDark'],
      ['Link star image','linkStar'],['More Projects image','moreProjects'],
      ['Center face image','centerFace'],['Eyes','eyes'],
      ['Clouds \u2014 light mode','cloudsLight'],['Clouds \u2014 dark mode','cloudsDark'],
      ['Sun / Moon toggle','sunMoon'],['Three stars (music)','musicStars'],
      ['Mute image','mute'],['Unmute image','unmute'],['Signature','signature'],
    ];
    imgs.forEach(([label, key]) => imageControl(host, label, () => API.get('assets.' + key), (v) => API.set('assets.' + key, v)));
  }

  /* ---------- SCENE EDITORS ---------- */
  function sceneSectionEditor(host, secId) {
    const idx = () => (API.get('sceneSections') || []).findIndex((s) => s.id === secId);
    const sec = () => (API.get('sceneSections') || [])[idx()];
    if (!sec()) { host.appendChild(el('<p class="rwa-empty">Section not found.</p>')); return; }
    host.appendChild(group('Section title'));
    const tf = field('Title', `<input class="rwa-input" value="${esc(sec().title)}">`); const tinp = q('input', tf);
    tinp.addEventListener('input', () => API.update('sceneSections', (arr) => arr.map((s) => s.id === secId ? { ...s, title: tinp.value } : s)));
    host.appendChild(tf);
    host.appendChild(group('Content'));
    host.appendChild(el('<p class="rwa-editor-hint">Images and videos keep their own type. Drag \u2630 to reorder.</p>'));
    sceneItemList(host, secId);
    const delBtn = el('<button type="button" class="rwa-btn rwa-btn-danger" style="margin-top:18px">Delete this section</button>');
    delBtn.addEventListener('click', () => { const s = sec(); const n = (s.items || []).length;
      if (confirm(`Delete section "${s.title}"?` + (n ? ` Its ${n} item(s) will also be deleted.` : '') + ' This cannot be undone.')) {
        API.update('sceneSections', (arr) => arr.filter((x) => x.id !== secId)); openCategory('scene'); } });
    host.appendChild(delBtn);
  }
  function sceneItemList(host, secId) {
    const wrap = el('<div class="rwa-sub-list"></div>'); host.appendChild(wrap);
    const addImg = el('<button type="button" class="rwa-add-btn">+ Add image</button>');
    const addVid = el('<button type="button" class="rwa-add-btn">+ Add video</button>');
    host.append(addImg, addVid);
    const secItems = () => { const s = (API.get('sceneSections') || []).find((x) => x.id === secId); return s ? (s.items || []) : []; };
    const mutate = (fn) => API.update('sceneSections', (arr) => arr.map((s) => s.id === secId ? { ...s, items: fn(deepClone(s.items || [])) } : s));
    const render = () => {
      wrap.innerHTML = '';
      const items = secItems();
      if (!items.length) wrap.appendChild(el('<p class="rwa-empty">No content yet.</p>'));
      items.forEach((it) => {
        const row = el('<div class="rwa-sub-item" draggable="true"></div>'); row.dataset.id = it.id;
        row.appendChild(el('<span class="rwa-drag">\u2630</span>'));
        row.appendChild(el(`<span class="rwa-tool-chip">${it.type}</span>`));
        const srcInp = el(`<input class="rwa-input" placeholder="path/to/${it.type}" value="${esc(it.src || '')}">`);
        srcInp.addEventListener('change', () => mutate((a) => a.map((x) => x.id === it.id ? { ...x, src: srcInp.value } : x)));
        row.appendChild(srcInp);
        const up = el('<button type="button" class="rwa-icon-btn" title="Upload">\u2191</button>');
        up.addEventListener('click', () => { const fi = document.createElement('input'); fi.type = 'file'; fi.accept = it.type === 'video' ? 'video/*' : 'image/*';
          fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => mutate((a) => a.map((x) => x.id === it.id ? { ...x, src: r.result } : x)); r.readAsDataURL(f); }; fi.click(); });
        const rm = el('<button type="button" class="rwa-icon-btn rwa-del">\u2715</button>');
        rm.addEventListener('click', () => { if (confirm('Delete this item?')) mutate((a) => a.filter((x) => x.id !== it.id)); });
        row.append(up, rm);
        row.addEventListener('dragstart', () => row.classList.add('rwa-dragging'));
        row.addEventListener('dragend', () => { row.classList.remove('rwa-dragging'); const ids = qa('.rwa-sub-item', wrap).map((r) => r.dataset.id); mutate((a) => ids.map((id) => a.find((x) => x.id === id)).filter(Boolean)); });
        wrap.appendChild(row);
      });
    };
    wrap.addEventListener('dragover', (e) => { e.preventDefault(); const d = q('.rwa-dragging', wrap); if (!d) return;
      const after = [...qa('.rwa-sub-item:not(.rwa-dragging)', wrap)].find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
      if (after) wrap.insertBefore(d, after); else wrap.appendChild(d); });
    addImg.addEventListener('click', () => mutate((a) => { a.push({ id: uid(), type: 'image', src: '', title: '' }); return a; }));
    addVid.addEventListener('click', () => mutate((a) => { a.push({ id: uid(), type: 'video', src: '', title: '' }); return a; }));
    render(); API.subscribe('sceneSections', render);
  }
  function sceneAddSection(host) {
    host.appendChild(el('<p class="rwa-editor-hint">Create a new section. It appears in the Scene pop-up immediately.</p>'));
    const f = field('Section name', '<input class="rwa-input" placeholder="e.g. Sketches">'); const inp = q('input', f); host.appendChild(f);
    const btn = el('<button type="button" class="rwa-btn rwa-btn-primary">Create section</button>');
    const st = status(host);
    btn.addEventListener('click', () => { const name = inp.value.trim(); if (!name) return st('Type a name first', false);
      API.update('sceneSections', (arr) => { arr.push({ id: uid('sec'), title: name, desc: 'Manage ' + name.toLowerCase(), items: [] }); return arr; });
      st('Created \u2713'); openCategory('scene'); });
    host.appendChild(btn);
  }

  /* ---------- LINKS EDITOR ---------- */
