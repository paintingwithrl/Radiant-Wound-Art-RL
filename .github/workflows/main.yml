            <span class="rwa-sidebar-label">SETTINGS</span>
            <nav class="rwa-sidebar-nav"></nav>
            <div class="rwa-sidebar-footer"></div>
          </aside>

          <!-- desktop content panel -->
          <section class="rwa-main-panel">
            <header class="rwa-main-head">
              <h2 id="rwaMainTitle">Web Theme</h2>
              <p id="rwaMainSub" class="rwa-main-sub"></p>
            </header>
            <div class="rwa-main-body"></div>
          </section>

          <!-- portrait phone / tablet (built by JS: list OR detail, never both) -->
          <section class="rwa-mobile-view"></section>
