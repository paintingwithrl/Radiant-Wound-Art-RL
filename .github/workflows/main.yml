  function buildHomeSticky(n){
  const el = document.createElement("div");
  el.className = "sticky-note" + (n.pinned ? " pinned" : "");
  el.dataset.id = n.id;
  el.style.left = (n.xPct != null ? n.xPct * window.innerWidth  : (n.x ?? 80))  + "px";
  el.style.top  = (n.yPct != null ? n.yPct * window.innerHeight : (n.y ?? 160)) + "px";
  if (n.w) el.style.width  = n.w + "px";
  if (n.h) el.style.height = n.h + "px";
  el.style.setProperty("--sticky-bg", n.color || "#fff7a8");
  el.style.background = n.color || "#fff7a8";
  el.innerHTML = `
    <div class="sticky-header">
      <span><img src="images/Pin.png" alt="" class="inline-icon" /> Note</span>
      <button class="sticky-close" title="Hide from home">×</button>
    </div>
    <div class="sticky-content">${escapeHtml(n.text || "")}</div>
  `;

  // The ONLY ways a sticky should disappear//
  el.querySelector(".sticky-close").addEventListener("click", e => {
    e.stopPropagation();
    patchNote(n.id, { visible: false });
  });

  function togglePin(){
    const nowPinned = !el.classList.contains("pinned");
    el.classList.toggle("pinned", nowPinned);
    patchNote(n.id, { pinned: nowPinned }, { skipRender: true });
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  }
  el.addEventListener("dblclick", e => {
    if (e.target.closest(".sticky-close")) return;
    togglePin();
  });

  let dragging=false, moved=false, ox=0, oy=0, sx=0, sy=0;
  let lastTap = 0;
  let resizing = false;
  const THRESH = 4;

  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".sticky-close")) return;
    const r0 = el.getBoundingClientRect();
    // bottom-right 22px square = native resize handle
    if (e.clientX > r0.right - 22 && e.clientY > r0.bottom - 22){
      resizing = true;
      return; // let the browser handle native resize
    }
    if (e.pointerType === "touch"){
      const now = Date.now();
      if (now - lastTap < 350){ togglePin(); lastTap = 0; return; }
      lastTap = now;
    }
    if (el.classList.contains("pinned")) return;
    dragging = true; moved = false;
    ox = e.clientX - r0.left; oy = e.clientY - r0.top;
    sx = e.clientX; sy = e.clientY;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (!moved){
      if (Math.abs(e.clientX - sx) < THRESH && Math.abs(e.clientY - sy) < THRESH) return;
      moved = true;
      el.classList.add("dragging");
      el.classList.add("user-moved");
      el.style.zIndex = 200;
    }
    let nx = e.clientX - ox, ny = e.clientY - oy;
    const r = el.getBoundingClientRect();
    nx = Math.max(0, Math.min(nx, window.innerWidth  - r.width));
    ny = Math.max(0, Math.min(ny, window.innerHeight - r.height));
    el.style.left = nx + "px"; el.style.top = ny + "px";
  });

function clampSticky(el, persist){
  if (!el) return;
  const margin = 6;
  const maxW = Math.min(window.innerWidth  * 0.9, 420);
  const maxH = window.innerHeight * 0.7;
  const rB = el.getBoundingClientRect();
  let w = Math.max(140, Math.min(rB.width,  maxW));
  let h = Math.max(90,  Math.min(rB.height, maxH));
  if (Math.abs(w-rB.width)>0.5)  el.style.width  = w+"px";
  if (Math.abs(h-rB.height)>0.5) el.style.height = h+"px";
  const r = el.getBoundingClientRect();
  let x = parseFloat(el.style.left) || r.left;
  let y = parseFloat(el.style.top)  || r.top;
  x = Math.max(margin, Math.min(x, window.innerWidth  - r.width  - margin));
  y = Math.max(margin, Math.min(y, window.innerHeight - r.height - margin));
  el.style.left = x+"px"; el.style.top = y+"px";
  if (persist){
    const id = el.dataset.id;
    if (id) patchNote(id, { x, y, w:Math.round(w), h:Math.round(h) }, { skipRender:true });
  }
}
function clampAllStickies(persist){ document.querySelectorAll(".sticky-note:not(.pinned)").forEach(el => clampSticky(el, persist)); }
let _stickyResizeT;

function replaceStickies(){
  const notes = loadNotes();
  document.querySelectorAll(".sticky-note").forEach(el => {
    const n = notes.find(x => String(x.id) === String(el.dataset.id));
    if (n && n.xPct != null){
      el.style.left = (n.xPct * window.innerWidth)  + "px";
      el.style.top  = (n.yPct * window.innerHeight) + "px";
    }
    clampSticky(el, false);   // fit on screen WITHOUT overwriting the saved spot
  });
}

window.addEventListener("resize", () => { clearTimeout(_stickyResizeT); _stickyResizeT = setTimeout(replaceStickies, 80); });
window.addEventListener("orientationchange", () => setTimeout(replaceStickies, 150));


  function endDrag(e){
    if (resizing){
      // Save the actually-resized dimensions; do NOT rebuild the layer
      const r = el.getBoundingClientRect();
            patchNote(n.id, {
        x: r.left, y: r.top,
        xPct: r.left / window.innerWidth,
        yPct: r.top  / window.innerHeight
      }, { skipRender: true });
      resizing = false;
      return;
    }
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    try { el.releasePointerCapture(e.pointerId); } catch {}
    if (moved){
      const r = el.getBoundingClientRect();
      patchNote(n.id, { x: r.left, y: r.top }, { skipRender: true });
    }
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);

requestAnimationFrame(() => clampSticky(el, false));

  stickyLayer.appendChild(el);
}

