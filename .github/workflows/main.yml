      page.innerHTML = `<h2>${esc(fld.title)}</h2>`;
      (fld.items || []).forEach((it) => {
        if (it.type === 'text') { const p = document.createElement('p'); p.textContent = it.text || ''; page.appendChild(p); }
        else if (it.type === 'image') { const im = document.createElement('img'); im.className = 'gallery-item'; im.src = it.src; im.alt = '';
          im.addEventListener('click', () => openViewer(im.src, 'img')); page.appendChild(im); }
        else if (it.type === 'video') { const v = document.createElement('video'); v.className = 'gallery-item'; v.setAttribute('controls',''); v.innerHTML = `<source src="${esc(it.src)}" type="video/mp4" />`;
          v.addEventListener('click', () => { v.pause(); openViewer(v.currentSrc || it.src, 'video'); }); page.appendChild(v); }
        else if (it.type === 'audio') { const c = document.createElement('div'); c.className = 'music-card';
          c.innerHTML = `<img src="images/Playicon.png" class="play-btn" alt="Play" /><div><strong>${esc(it.title||'Track')}</strong></div>`;
          const au = document.createElement('audio'); au.src = it.src; const btn = c.querySelector('.play-btn');
          btn.addEventListener('click', (e) => { e.stopPropagation(); if (au.paused) { au.play().catch(()=>{}); btn.src='images/Pauseicon.png'; } else { au.pause(); btn.src='images/Playicon.png'; } });
          au.addEventListener('ended', () => btn.src = 'images/Playicon.png'); c.appendChild(au); page.appendChild(c); }
        else if (it.type === 'file') { const b = document.createElement('button'); b.className = 'load-btn'; b.textContent = it.title || 'Read file';
          const box = document.createElement('div'); box.className = 'text-viewer';
          b.addEventListener('click', () => { if (window.loadText) { box.id = box.id || uid('tv'); window.loadText(it.src, box.id); } });
          page.appendChild(b); page.appendChild(box); }
      });
      const container = q('#projectsPopup .projects-desktop'); if (container) container.appendChild(page);
    });
  }

  function openProjectPage(pageId, folder) {
    qa('#projectsPopup .projects-page').forEach((p) => p.classList.remove('active'));
    const pg = document.getElementById(pageId); if (pg) pg.classList.add('active');
    qa('#projectsPopup .folder').forEach((f) => f.classList.remove('open'));
    folder && folder.classList.add('open');
    const back = q('#projectsBackBtn'); if (back) back.style.display = 'block';
  }
  global.rwaOpenProjectPage = openProjectPage;

  function applyPet() {
    const p = state.apps.pet;
    global.__petMoods = (p.moods || []).map((m) => m.label);
    global.__petMoodMap = {}; (p.moods || []).forEach((m) => (global.__petMoodMap[m.label] = m.img));
    const petImg = q('#pet'); const cur = q('#petMood');
    if (petImg && cur && global.__petMoodMap[cur.textContent] ) petImg.src = global.__petMoodMap[cur.textContent];
    const icon = q('.folder.app-icon[onclick*="openPetApp"] img'); if (icon && p.icon) icon.src = p.icon;
    // room background behind the pet (like a pet-game room)
    const stage = q('#petApp .pet-stage');
    if (stage) {
      if (p.roomBg) { stage.style.backgroundImage = `url("${p.roomBg}")`; stage.style.backgroundSize = 'cover'; stage.style.backgroundPosition = 'center'; stage.classList.add('rwa-has-room'); }
       else { stage.style.backgroundImage = ''; stage.classList.remove('rwa-has-room'); }
    }
    const help = q('#petHelpTooltip'); if (help && p.helpText != null) help.textContent = p.helpText;
    const hint = q('#petApp .pet-hint'); if (hint && p.hintText != null) hint.textContent = p.hintText;
  }

  function applyAppIcons() {
    const map = {
      'openPaintApp': state.apps.painting.icon,
      'openNotesApp': state.apps.notes.icon,
      'openFeedbackApp': state.apps.feedback.icon,
      'openGoalApp': state.apps.goals.icon,
    };
    Object.entries(map).forEach(([fn, src]) => { const im = q(`.folder.app-icon[onclick*="${fn}"] img`); if (im && src) im.src = src; });
  }

  function applyNotes() {
    const n = state.apps.notes;
    const host = q('#notesDetailPage .sticky-colors');
    if (host) {
      qa('.color-swatch', host).forEach((b) => b.remove());
      (n.colors || []).forEach((c) => { const b = document.createElement('button'); b.className = 'color-swatch'; b.dataset.color = c; b.style.background = c;
        b.addEventListener('click', () => { const ta = q('#notesArea'); void ta; }); host.appendChild(b); });
    }
    let styleTag = q('#rwa-notes-bg'); if (!styleTag) { styleTag = document.createElement('style'); styleTag.id = 'rwa-notes-bg'; document.head.appendChild(styleTag); }
    styleTag.textContent = n.bgImage
      ? `.sticky-note{background-image:url("${n.bgImage}") !important;background-size:cover !important;background-position:center !important;}`
      : '';
  }

    function applyGoals() {
    const g = state.apps.goals || {};
    let st = document.getElementById('rwa-goals-style');
    if (!st) { st = document.createElement('style'); st.id = 'rwa-goals-style'; document.head.appendChild(st); }
    st.textContent = `
      .goal-widget{ background:linear-gradient(135deg, ${g.lightFrom || '#b58dff'}, ${g.lightTo || '#8f4bd4'}) !important; }
      body.dark .goal-widget{ background:linear-gradient(135deg, ${g.darkFrom || '#5a2da6'}, ${g.darkTo || '#2a0d5e'}) !important; }
      .goal-widget .gw-fill{ background:linear-gradient(90deg, ${g.barFrom || '#ffe27a'}, ${g.barTo || '#ffb84d'}) !important; }
      ${g.starIcon ? `.goal-widget .gw-star{ background-image:url("${g.starIcon}") !important; }` : ''}
    `;
    applyAppIcons();
  }


  function applyCanvas() {
    const c = q('#paintCanvas'); if (c) { c.style.maxWidth = state.apps.painting.canvasW + 'px'; }
  }

  /* ---- sequential background-music queue ---- */
  function setupMusicQueue() {
    const music = q('#bg-music'); if (!music) return;
    let idx = 0;
    function loadTrack(i) {
      const qarr = state.audio.queue || []; if (!qarr.length) return;
      idx = ((i % qarr.length) + qarr.length) % qarr.length;
      const src = qarr[idx].src; const cur = music.querySelector('source');
      if (cur) cur.src = src; else music.src = src;
      music.volume = state.audio.volume ?? 0.7; music.loop = qarr.length === 1;
      music.load();
    }
    music.addEventListener('ended', () => { const qarr = state.audio.queue || []; if (qarr.length > 1) { loadTrack(idx + 1); music.play().catch(()=>{}); } });
    global.__rwaReloadMusic = () => { const wasPlaying = !music.paused; loadTrack(0); if (wasPlaying) music.play().catch(()=>{}); };
    loadTrack(0);
    subscribe('audio.volume', () => { music.volume = state.audio.volume ?? 0.7; });
  }

  function applyAll() {
    try { applyTheme(); } catch(e){ console.warn(e); }
    try { applyPositions(); } catch(e){ console.warn(e); }
    try { applyAssets(); } catch(e){ console.warn(e); }
    try { applyArtist(); } catch(e){ console.warn(e); }
    try { applyLinks(); } catch(e){ console.warn(e); }
    try { applyScene(); } catch(e){ console.warn(e); }
    try { applyProjects(); } catch(e){ console.warn(e); }
    try { applyPet(); } catch(e){ console.warn(e); }
    try { applyAppIcons(); } catch(e){ console.warn(e); }
    try { applyNotes(); } catch(e){ console.warn(e); }
    try { applyGoals(); } catch(e){ console.warn(e); }
    try { applyCanvas(); } catch(e){ console.warn(e); }
  }

  subscribe('theme', applyTheme);
  subscribe('positions', applyPositions);
  subscribe('assets', applyAssets);
  subscribe('artist', applyArtist);
  subscribe('links', applyLinks);
  subscribe('sceneSections', applyScene);
  subscribe('projects', applyProjects);
  subscribe('apps.pet', applyPet);
  subscribe('apps.notes', applyNotes);
  subscribe('apps.goals', applyGoals);
  subscribe('apps.painting', applyCanvas);
  subscribe('apps.feedback', applyAppIcons);
  subscribe('audio.queue', () => global.__rwaReloadMusic && global.__rwaReloadMusic());

  function onReady(fn) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn(); }
  onReady(() => {
    applyAll(); setupMusicQueue();
    new MutationObserver(() => { applyTheme(); applyGoals(); })
      .observe(document.body, { attributes: true, attributeFilter: ['class'] });
  });

  /* =========================================================
     SETTINGS UI  (desktop sidebar+hub  /  portrait drill-down)
