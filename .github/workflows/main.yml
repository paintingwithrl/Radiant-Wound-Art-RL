  <div id="viewer" class="viewer hidden" oncontextmenu="return false;">
    <img id="viewerClose" src="images/Close Button.png" alt="Close" />
    <div id="viewerStage">
      <img id="viewerImg" alt="" draggable="false" />
      <video id="viewerVideo" controls controlsList="nodownload noremoteplayback" disablepictureinpicture></video>
      <img id="viewerWatermark" src="images/My Signature (RL).png" alt="" draggable="false" />
      <div id="viewerShield"></div>
    </div>
  </div>


