        const up = el('<button type="button" class="rwa-icon-btn" title="Change icon">\u{1F5BC}</button>');
        up.addEventListener('click', () => { const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => API.listUpdate('links.items', it.id, { icon: r.result }); r.readAsDataURL(f); }; fi.click(); });
        const ti = el(`<input class="rwa-input" placeholder="Title" style="flex:1 1 120px" value="${esc(it.title || '')}">`);
        ti.addEventListener('change', () => API.listUpdate('links.items', it.id, { title: ti.value }));
        const ui = el(`<input class="rwa-input" placeholder="https://\u2026" style="flex:2 1 200px" value="${esc(it.url || '')}">`);
        ui.addEventListener('change', () => API.listUpdate('links.items', it.id, { url: ui.value }));
        const rm = el('<button type="button" class="rwa-icon-btn rwa-del">\u2715</button>');
        rm.addEventListener('click', () => { if (confirm(`Delete link "${it.title || ''}"?`)) API.listRemove('links.items', it.id); });
        row.append(th, up, ti, ui, rm);
        row.addEventListener('dragstart', () => row.classList.add('rwa-dragging'));
        row.addEventListener('dragend', () => { row.classList.remove('rwa-dragging'); const ids = qa('.rwa-sub-item', wrap).map((r) => r.dataset.id); API.listReorder('links.items', ids); });
        wrap.appendChild(row);
      });
    };
    wrap.addEventListener('dragover', (e) => { e.preventDefault(); const d = q('.rwa-dragging', wrap); if (!d) return;
      const after = [...qa('.rwa-sub-item:not(.rwa-dragging)', wrap)].find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
      if (after) wrap.insertBefore(d, after); else wrap.appendChild(d); });
    add.addEventListener('click', () => API.listAdd('links.items', { title: 'New link', url: '', icon: '' }));
    render(); API.subscribe('links.items', render);
  }

  /* ---------- PROJECTS EDITORS ---------- */
  function projectFolderEditor(host, fid) {
    const folder = () => (API.get('projects.folders') || []).find((f) => f.id === fid);
    if (!folder()) { host.appendChild(el('<p class="rwa-empty">Folder not found.</p>')); return; }
    host.appendChild(group('Folder name'));
    const tf = field('Name', `<input class="rwa-input" value="${esc(folder().title)}">`); const tinp = q('input', tf);
    tinp.addEventListener('input', () => API.update('projects.folders', (arr) => arr.map((f) => f.id === fid ? { ...f, title: tinp.value } : f)));
    host.appendChild(tf);
    host.appendChild(group('Contents'));
    host.appendChild(el('<p class="rwa-editor-hint">Text, images, videos, audio and files each use the right editor. Drag \u2630 to reorder.</p>'));
    const mutate = (fn) => API.update('projects.folders', (arr) => arr.map((f) => f.id === fid ? { ...f, items: fn(deepClone(f.items || [])) } : f));
    const items = () => { const f = folder(); return f ? (f.items || []) : []; };
    const wrap = el('<div class="rwa-sub-list"></div>'); host.appendChild(wrap);
    const render = () => {
      wrap.innerHTML = '';
      if (!items().length) wrap.appendChild(el('<p class="rwa-empty">Empty folder.</p>'));
      items().forEach((it) => {
        const row = el('<div class="rwa-sub-item" draggable="true" style="flex-wrap:wrap"></div>'); row.dataset.id = it.id;
        row.appendChild(el('<span class="rwa-drag">\u2630</span>'));
        row.appendChild(el(`<span class="rwa-tool-chip">${it.type}</span>`));
        if (it.type === 'text') {
          const ta = el(`<textarea class="rwa-textarea" style="flex:1 1 100%">${esc(it.text || '')}</textarea>`);
          ta.addEventListener('change', () => mutate((a) => a.map((x) => x.id === it.id ? { ...x, text: ta.value } : x)));
          row.appendChild(ta);
        } else {
          const si = el(`<input class="rwa-input" placeholder="path" value="${esc(it.src || '')}">`);
          si.addEventListener('change', () => mutate((a) => a.map((x) => x.id === it.id ? { ...x, src: si.value } : x)));
          row.appendChild(si);
          if (it.type === 'file' || it.type === 'audio') {
            const ti = el(`<input class="rwa-input" placeholder="Button/label" style="flex:1 1 120px" value="${esc(it.title || '')}">`);
            ti.addEventListener('change', () => mutate((a) => a.map((x) => x.id === it.id ? { ...x, title: ti.value } : x)));
            row.appendChild(ti);
          }
          const up = el('<button type="button" class="rwa-icon-btn" title="Upload">\u2191</button>');
          up.addEventListener('click', () => { const fi = document.createElement('input'); fi.type = 'file';
            fi.accept = it.type === 'image' ? 'image/*' : it.type === 'video' ? 'video/*' : it.type === 'audio' ? 'audio/*' : '*/*';
            fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => mutate((a) => a.map((x) => x.id === it.id ? { ...x, src: r.result } : x)); r.readAsDataURL(f); }; fi.click(); });
          row.appendChild(up);
        }
        const rm = el('<button type="button" class="rwa-icon-btn rwa-del">\u2715</button>');
        rm.addEventListener('click', () => { if (confirm('Delete this item?')) mutate((a) => a.filter((x) => x.id !== it.id)); });
        row.appendChild(rm);
        row.addEventListener('dragstart', () => row.classList.add('rwa-dragging'));
        row.addEventListener('dragend', () => { row.classList.remove('rwa-dragging'); const ids = qa('.rwa-sub-item', wrap).map((r) => r.dataset.id); mutate((a) => ids.map((id) => a.find((x) => x.id === id)).filter(Boolean)); });
        wrap.appendChild(row);
      });
    };
    wrap.addEventListener('dragover', (e) => { e.preventDefault(); const d = q('.rwa-dragging', wrap); if (!d) return;
      const after = [...qa('.rwa-sub-item:not(.rwa-dragging)', wrap)].find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
      if (after) wrap.insertBefore(d, after); else wrap.appendChild(d); });
    const addRow = el('<div class="rwa-swatch-row" style="margin-top:8px"></div>');
    [['text','+ Text'],['image','+ Image'],['video','+ Video'],['audio','+ Audio'],['file','+ File']].forEach(([type, lbl]) => {
      const b = el(`<button type="button" class="rwa-add-btn" style="margin:0">${lbl}</button>`);
      b.addEventListener('click', () => mutate((a) => { a.push(type === 'text' ? { id: uid(), type, text: '' } : { id: uid(), type, src: '', title: '' }); return a; }));
      addRow.appendChild(b);
    });
    host.appendChild(addRow);
    const del = el('<button type="button" class="rwa-btn rwa-btn-danger" style="margin-top:18px">Delete this folder</button>');
    del.addEventListener('click', () => { if (confirm(`Delete folder "${folder().title}" and all its contents? This cannot be undone.`)) { API.update('projects.folders', (arr) => arr.filter((f) => f.id !== fid)); openCategory('projects'); } });
    host.appendChild(del);
    render(); API.subscribe('projects.folders', render);
  }
  function projectAddFolder(host) {
    host.appendChild(el('<p class="rwa-editor-hint">Create a new folder. It appears in the More Projects pop-up immediately.</p>'));
    const f = field('Folder name', '<input class="rwa-input" placeholder="e.g. Sketchbook">'); const inp = q('input', f); host.appendChild(f);
    const btn = el('<button type="button" class="rwa-btn rwa-btn-primary">Create folder</button>'); const st = status(host);
    btn.addEventListener('click', () => { const name = inp.value.trim(); if (!name) return st('Type a name first', false);
      API.update('projects.folders', (arr) => { arr.push({ id: uid('fld'), title: name, items: [] }); return arr; });
      st('Created \u2713'); openCategory('projects'); });
    host.appendChild(btn);
  }

  /* ---------- MUSIC EDITORS ---------- */
  function musicQueueEditor(host) {
    host.appendChild(el('<p class="rwa-editor-hint">Songs play in order: 1 \u2192 2 \u2192 3 \u2026 Drag \u2630 to reorder.</p>'));
    rangeField(host, 'Volume', 'audio.volume', 0, 1, 0.05, '');
    const wrap = el('<div class="rwa-sub-list"></div>'); host.appendChild(wrap);
    const add = el('<button type="button" class="rwa-add-btn">+ Add track</button>'); host.appendChild(add);
    const render = () => {
      wrap.innerHTML = '';
      const items = API.get('audio.queue') || [];
      if (!items.length) wrap.appendChild(el('<p class="rwa-empty">No tracks yet.</p>'));
      items.forEach((it, i) => {
        const row = el('<div class="rwa-sub-item" draggable="true" style="flex-wrap:wrap"></div>'); row.dataset.id = it.id;
        row.appendChild(el(`<span class="rwa-drag">\u2630</span>`));
        row.appendChild(el(`<span class="rwa-tool-chip">${i + 1}</span>`));
        const ti = el(`<input class="rwa-input" placeholder="Song name" style="flex:1 1 140px" value="${esc(it.title || '')}">`);
        ti.addEventListener('change', () => API.listUpdate('audio.queue', it.id, { title: ti.value }));
        const si = el(`<input class="rwa-input" placeholder="Audio Sound/song.mp3" style="flex:2 1 200px" value="${esc(it.src || '')}">`);
        si.addEventListener('change', () => API.listUpdate('audio.queue', it.id, { src: si.value }));
        const up = el('<button type="button" class="rwa-icon-btn" title="Replace file">\u2191</button>');
        up.addEventListener('click', () => { const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'audio/*';
          fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => API.listUpdate('audio.queue', it.id, { src: r.result, title: it.title || f.name }); r.readAsDataURL(f); }; fi.click(); });
        const rm = el('<button type="button" class="rwa-icon-btn rwa-del">\u2715</button>');
        rm.addEventListener('click', () => { if (confirm(`Remove track "${it.title || ''}"?`)) API.listRemove('audio.queue', it.id); });
        row.append(ti, si, up, rm);
        row.addEventListener('dragstart', () => row.classList.add('rwa-dragging'));
        row.addEventListener('dragend', () => { row.classList.remove('rwa-dragging'); const ids = qa('.rwa-sub-item', wrap).map((r) => r.dataset.id); API.listReorder('audio.queue', ids); });
        wrap.appendChild(row);
      });
    };
    wrap.addEventListener('dragover', (e) => { e.preventDefault(); const d = q('.rwa-dragging', wrap); if (!d) return;
      const after = [...qa('.rwa-sub-item:not(.rwa-dragging)', wrap)].find((c) => e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
      if (after) wrap.insertBefore(d, after); else wrap.appendChild(d); });
    add.addEventListener('click', () => API.listAdd('audio.queue', { title: 'New track', src: '' }));
    render(); API.subscribe('audio.queue', render);
  }
  function systemSoundsEditor(host) {
    [['Click sound', 'audio.systemClick'], ['Close sound', 'audio.systemClose']].forEach(([label, path]) => {
      const card = el(`<div class="rwa-img-card"><span class="rwa-img-meta">
        <span class="rwa-img-name">${label}</span>
        <input class="rwa-input" type="text" value="${esc(API.get(path))}">
        <span class="rwa-img-actions">
          <button type="button" class="rwa-btn rwa-btn-primary rwa-up">Replace</button>
          <button type="button" class="rwa-btn rwa-btn-ghost rwa-play">\u25b6 Preview</button>
        </span></span></div>`);
      const inp = q('input', card), st = status(host);
      q('input', card).addEventListener('change', () => { API.set(path, inp.value); st('Saved \u2713'); });
      q('.rwa-up', card).addEventListener('click', () => { const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'audio/*';
        fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { API.set(path, r.result); inp.value = r.result; st('Saved \u2713'); }; r.readAsDataURL(f); }; fi.click(); });
      q('.rwa-play', card).addEventListener('click', () => { try { new Audio(API.get(path)).play(); } catch (e) { st('Cannot preview', false); } });
      host.appendChild(card);
    });
  }
  function spotifyEditor(host) {
    host.appendChild(el('<p class="rwa-editor-hint">Click the three stars 3 times on the homepage to open the floating player. Paste a Spotify <b>embed</b> URL (open.spotify.com/embed/\u2026).</p>'));
    textField(host, 'Spotify embed URL', 'audio.spotifyUrl');
    const btn = el('<button type="button" class="rwa-btn rwa-btn-primary">Apply to player</button>');
    btn.addEventListener('click', () => { const f = q('#rwaSpotifyMini iframe'); if (f) f.src = API.get('audio.spotifyUrl'); alert('Player updated \u2713'); });
    host.appendChild(btn);
       host.appendChild(group('Player colors \u2014 Light mode'));
    colorField(host, 'Body color', 'audio.spotifyLightBody');
    colorField(host, 'Title bar color', 'audio.spotifyLightHead');
    host.appendChild(group('Player colors \u2014 Dark mode'));
    colorField(host, 'Body color', 'audio.spotifyDarkBody');
    colorField(host, 'Title bar color', 'audio.spotifyDarkHead'); 
  }

  /* ---------- APPS EDITORS ---------- */
  function appPainting(host) {
    host.appendChild(group('App icon'));
    imageControl(host, 'Painting app icon', () => API.get('apps.painting.icon'), (v) => API.set('apps.painting.icon', v));
    host.appendChild(group('Canvas size'));
    numberField(host, 'Canvas width (px)', 'apps.painting.canvasW');
    numberField(host, 'Canvas height (px)', 'apps.painting.canvasH');
    host.appendChild(group('Existing tools'));
    const tools = el('<div class="rwa-tools-list"></div>');
    (API.get('apps.painting.tools') || []).forEach((t) => tools.appendChild(el(`<span class="rwa-tool-chip">${esc(t)}</span>`)));
    host.appendChild(tools);
  }
  function appFeedback(host) {
    host.appendChild(group('App icon'));
    imageControl(host, 'Feedback app icon', () => API.get('apps.feedback.icon'), (v) => API.set('apps.feedback.icon', v));
    host.appendChild(group('Where feedback is sent'));
    textField(host, 'Recipient email', 'apps.feedback.recipient');
    host.appendChild(el('<p class="rwa-editor-hint">This form opens your device email app pre-filled to the address above (no server needed, nothing to break). True automatic sending would require a backend email service (e.g. a form endpoint) \u2014 not possible from a plain static page.</p>'));
  }
  function appNotes(host) {
    host.appendChild(group('App icon'));
    imageControl(host, 'Notes app icon', () => API.get('apps.notes.icon'), (v) => API.set('apps.notes.icon', v));
    host.appendChild(group('Sticky note colors'));
    const row = el('<div class="rwa-swatch-row"></div>');
    const render = () => { row.innerHTML = '';
      (API.get('apps.notes.colors') || []).forEach((c, i) => {
        const cell = el(`<div style="display:flex;flex-direction:column;gap:4px;align-items:center"><input type="color" value="${esc(c)}"><button class="rwa-icon-btn rwa-del" title="Remove">\u2715</button></div>`);
        q('input', cell).addEventListener('input', (e) => API.update('apps.notes.colors', (a) => { a[i] = e.target.value; return a; }));
        q('button', cell).addEventListener('click', () => API.update('apps.notes.colors', (a) => a.filter((_, j) => j !== i)));
        row.appendChild(cell);
      });
      const add = el('<button class="rwa-add-btn" style="margin:0">+ Add color</button>');
      add.addEventListener('click', () => API.update('apps.notes.colors', (a) => { a.push('#ffffff'); return a; }));
      row.appendChild(add);
    };
    render(); API.subscribe('apps.notes.colors', render); host.appendChild(row);
    host.appendChild(group('Sticky note background image'));
    imageControl(host, 'Background image (optional)', () => API.get('apps.notes.bgImage'), (v) => API.set('apps.notes.bgImage', v));
  }
    function appGoals(host) {
    host.appendChild(group('App icon'));
    imageControl(host, 'Goals app icon', () => API.get('apps.goals.icon'), (v) => API.set('apps.goals.icon', v));
    host.appendChild(group('Homepage star icon'));
    imageControl(host, 'Goal-bar star icon', () => API.get('apps.goals.starIcon'), (v) => API.set('apps.goals.starIcon', v));
    host.appendChild(group('Live preview'));
    const prev = el('<div class="rwa-widget-preview" style="display:flex;align-items:center;gap:10px;border-radius:999px;padding:10px 18px"><div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.45);flex:0 0 auto"></div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;margin-bottom:5px">My goal</div><div class="rwa-wp-bar" style="margin-top:0"><div class="rwa-wp-fill"></div></div></div></div>');
    const paint = () => { const g = API.get('apps.goals'), dark = isDark();
      prev.style.background = dark ? `linear-gradient(135deg, ${g.darkFrom}, ${g.darkTo})` : `linear-gradient(135deg, ${g.lightFrom}, ${g.lightTo})`;
      q('.rwa-wp-fill', prev).style.background = `linear-gradient(90deg, ${g.barFrom||'#ffe27a'}, ${g.barTo||'#ffb84d'})`; };
    paint(); API.subscribe('apps.goals', paint); host.appendChild(prev);
    host.appendChild(group('Progress bar color (the yellow bar)'));
    colorField(host, 'Bar start', 'apps.goals.barFrom');
    colorField(host, 'Bar end', 'apps.goals.barTo');
    host.appendChild(group('Widget body \u2014 Light mode'));
    colorField(host, 'Start color', 'apps.goals.lightFrom');
    colorField(host, 'End color', 'apps.goals.lightTo');
    host.appendChild(group('Widget body \u2014 Dark mode'));
    colorField(host, 'Start color', 'apps.goals.darkFrom');
    colorField(host, 'End color', 'apps.goals.darkTo');
  }
   function appPet(host) {
    host.appendChild(group('App icon'));
    imageControl(host, 'Pet app icon', () => API.get('apps.pet.icon'), (v) => API.set('apps.pet.icon', v));
    host.appendChild(group('Room background picture'));
    host.appendChild(el('<p class="rwa-editor-hint">This picture shows as the room behind your pet (like a pet-game room). Leave empty for no room.</p>'));
     imageControl(host, 'Room background', () => API.get('apps.pet.roomBg'), (v) => API.set('apps.pet.roomBg', v));
    host.appendChild(group('Text & tips'));
    textField(host, 'Help tooltip (the \u201c?\u201d bubble)', 'apps.pet.helpText', true);
    textField(host, 'Hint under the pet', 'apps.pet.hintText');
    host.appendChild(group('Moods'));
    host.appendChild(el('<p class="rwa-editor-hint">Every mood shows its image and name. New moods appear in the Pet app instantly.</p>'));
    listEditor(host, 'apps.pet.moods', { fields: ['label'], image: 'img', addLabel: '+ Add mood' });
  }

  /* ---------- 3-STAR SPOTIFY MINI-PLAYER ---------- */
     function bindSpotify() {
    const star = document.getElementById('music-stars');
    const mini = document.getElementById('rwaSpotifyMini');
    if (!mini) return;
    const iframe = mini.querySelector('iframe');
    if (iframe && !iframe.src) iframe.src = API.get('audio.spotifyUrl') || '';

    const POS = 'rwa-sp-pos';
    const place = () => {
      let p = null; try { p = JSON.parse(localStorage.getItem(POS) || 'null'); } catch (_) {}
      if (!p) return;
      const w = mini.offsetWidth || 320, h = mini.offsetHeight || 200;
      const x = Math.max(6, Math.min(p.xPct * window.innerWidth,  window.innerWidth  - w - 6));
      const y = Math.max(6, Math.min(p.yPct * window.innerHeight, window.innerHeight - h - 6));
      mini.style.left = x + 'px'; mini.style.top = y + 'px';
      mini.style.right = 'auto'; mini.style.bottom = 'auto';
      mini.classList.toggle('pinned', !!p.pinned);
    };
    const save = () => {
      const r = mini.getBoundingClientRect();
      localStorage.setItem(POS, JSON.stringify({
        xPct: r.left / window.innerWidth, yPct: r.top / window.innerHeight,
        pinned: mini.classList.contains('pinned')
      }));
    };
    place();
    window.addEventListener('resize', place);
    window.addEventListener('orientationchange', () => setTimeout(place, 150));

    const open = () => { if (iframe && !iframe.src) iframe.src = API.get('audio.spotifyUrl'); mini.classList.add('show'); place(); };
    let clicks = 0, timer = null;
    star && star.addEventListener('click', () => {
      clicks++; clearTimeout(timer); timer = setTimeout(() => clicks = 0, 700);
      if (clicks >= 3) { clicks = 0; open(); }
    });
    // stays open across reloads if it was pinned
    try { if ((JSON.parse(localStorage.getItem(POS) || 'null') || {}).pinned) open(); } catch (_) {}

    const closeBtn = mini.querySelector('.rwa-sp-close');
    closeBtn && closeBtn.addEventListener('click', () => mini.classList.remove('show'));
    const pinBtn = mini.querySelector('.rwa-sp-pin');
    pinBtn && pinBtn.addEventListener('click', () => { mini.classList.toggle('pinned'); save(); });

    const head = mini.querySelector('.rwa-sp-head');
    let drag = false, dx = 0, dy = 0;
    head && head.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      if (mini.classList.contains('pinned')) return;
      drag = true; dx = e.clientX - mini.offsetLeft; dy = e.clientY - mini.offsetTop;
      head.setPointerCapture(e.pointerId);
    });
    head && head.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const w = mini.offsetWidth, h = mini.offsetHeight;
      mini.style.left = Math.max(6, Math.min(e.clientX - dx, window.innerWidth  - w - 6)) + 'px';
      mini.style.top  = Math.max(6, Math.min(e.clientY - dy, window.innerHeight - h - 6)) + 'px';
      mini.style.bottom = 'auto'; mini.style.right = 'auto';
    });
    head && head.addEventListener('pointerup', (e) => { drag = false; save(); try { head.releasePointerCapture(e.pointerId); } catch (_) {} });
    head && head.addEventListener('dblclick', (e) => { e.stopPropagation(); mini.classList.toggle('pinned'); save(); });
  }
})(window);

});
