    let dragging=false, moved=false, ox=0, oy=0, sx=0, sy=0;
    let lastTap = 0, singleTimer = null;
    const THRESH = 4;

    w.addEventListener("pointerdown", e => {
      if (e.target.closest(".gw-x") || e.target.closest(".gw-link")) return;

      // touch double-tap = pin/unpin
      if (e.pointerType === "touch"){
        const now = Date.now();
        if (now - lastTap < 350){
          clearTimeout(singleTimer); singleTimer = null;
          togglePin(); lastTap = 0; return;
        }
        lastTap = now;
      }

      if (!w.classList.contains("pinned")){
        dragging = true; moved = false;
        const r = w.getBoundingClientRect();
        ox = e.clientX - r.left; oy = e.clientY - r.top;
        sx = e.clientX; sy = e.clientY;
        w.setPointerCapture(e.pointerId);
      } else {
        // pinned: pointerdown still allowed to count as tap → expand
        dragging = true; moved = false;
        sx = e.clientX; sy = e.clientY;
      }
    });

    w.addEventListener("pointermove", e => {
      if (!dragging || w.classList.contains("pinned")) return;
      if (!moved){
        if (Math.abs(e.clientX - sx) < THRESH && Math.abs(e.clientY - sy) < THRESH) return;
        moved = true;
        w.classList.add("dragging");
      }
      let nx = e.clientX - ox, ny = e.clientY - oy;
      const r = w.getBoundingClientRect();
      nx = Math.max(0, Math.min(nx, window.innerWidth  - r.width));
      ny = Math.max(0, Math.min(ny, window.innerHeight - r.height));
      w.style.left = nx + "px"; w.style.top = ny + "px";
    });

    function endDrag(e){
      const wasDragging = dragging, wasMoved = moved;
      if (dragging){
        dragging = false;
        w.classList.remove("dragging");
        try { w.releasePointerCapture(e.pointerId); } catch {}
