<div id="rwaSettingsOverlay" class="popup mini-app">
  <div class="popup-frame">
    <div class="popup-body">

      <div class="popup-header">
        <span>Settings</span>
        <img src="images/Close Button.png" id="rwaCloseBtn" class="close-btn" alt="Close" />
      </div>

      <div id="rwaSetRoot" class="popup-content settings-content">

        <!-- hidden file input for Import -->
        <input type="file" id="rwaImportFile" accept="application/json" hidden />

        <!-- ===== LOCK PAGE (shown ALONE while locked) ===== -->
        <div id="rwaLock" class="rwa-lock-screen">
          <img class="rwa-lock-icon" src="images/Lock.png" alt="" />
          <p id="rwaLockMsg" class="rwa-lock-msg">Settings are private.</p>
          <input type="password" id="rwaPassword" class="rwa-lock-input" placeholder="Enter password" />
          <div class="rwa-lock-actions">
            <button type="button" id="rwaUnlockBtn" class="rwa-lock-btn">Unlock</button>
